<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Painel GEMA · Admin</title>
  <link href="{{ '/admin/config.yml' | relative_url }}" type="text/yaml" rel="cms-config-url">
</head>
<body>
  <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js" type="module"></script>

  <!-- Ajuda para a equipe: aparece sobre a tela de login; dispensável -->
  <div id="gema-ajuda" hidden>
    <a href="{{ '/manual-edicao.html' | relative_url }}">📖 Primeira vez aqui? Veja o manual de edição</a>
    <button type="button" id="gema-ajuda-fechar" aria-label="Ocultar esta dica">×</button>
  </div>
  <style>
    #gema-ajuda{position:fixed;top:1rem;left:50%;transform:translateX(-50%);z-index:2147483647;
      display:flex;align-items:center;gap:.25rem;background:#fff;border:1px solid #d8d8e0;
      border-radius:100px;box-shadow:0 8px 28px rgba(0,0,0,.16);padding:.4rem .5rem .4rem 1.1rem;
      font-family:system-ui,sans-serif;font-size:.85rem;white-space:nowrap;max-width:92vw}
    #gema-ajuda a{color:#1C4EDD;text-decoration:none;overflow:hidden;text-overflow:ellipsis}
    #gema-ajuda a:hover{text-decoration:underline}
    #gema-ajuda button{background:none;border:none;cursor:pointer;font-size:1.1rem;line-height:1;
      color:#888;padding:.25rem .5rem;border-radius:50%}
    #gema-ajuda button:hover{color:#333}
    @media (prefers-color-scheme: dark){
      #gema-ajuda{background:#22222e;border-color:#3a3a4a}
      #gema-ajuda a{color:#8fa6f0}
      #gema-ajuda button{color:#999}
      #gema-ajuda button:hover{color:#ddd}
    }
  </style>
  <script>
    (function () {
      var dica = document.getElementById('gema-ajuda');
      try { if (localStorage.getItem('gema-ajuda-oculta') === '1') return; } catch (e) {}
      dica.hidden = false;
      document.getElementById('gema-ajuda-fechar').addEventListener('click', function () {
        dica.hidden = true;
        try { localStorage.setItem('gema-ajuda-oculta', '1'); } catch (e) {}
      });
    })();
  </script>
</body>
</html>
