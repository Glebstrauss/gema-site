title: GEMA
full_title: "GEMA — Grupo de Estudos em Melhoramento Animal"
description: "Grupo de pesquisa em genética quantitativa, genômica e melhoramento de equídeos brasileiros. EMEVZ · UFBA · Salvador, BA"
url: "https://glebstrauss.github.io"
baseurl: "/gema-site"
author: "GEMA/UFBA"
lang: pt-BR
timezone: "America/Bahia"

# Coleções
collections:
  professores:
    output: false
    sort_by: ordem

# Padrão de front matter
defaults:
  - scope:
      path: ""
    values:
      layout: "default"
  - scope:
      path: ""
      type: "professores"
    values:
      layout: null

# CSS minificado (style.scss → style.css comprimido)
sass:
  style: compressed

# Plugins (permitidos pelo GitHub Pages)
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Excluir do build
# (docs .md ficam fora: o builder do GitHub Pages ativa jekyll-optional-front-matter
#  e processaria o Markdown com Liquid — texto com tag literal quebra o build)
exclude:
  - Gemfile
  - Gemfile.lock
  - IMPLEMENTACAO.md
  - PLANO_DE_MELHORIA.md
  - README.md
  - "*.sh"
  - .bundle/
  - vendor/
